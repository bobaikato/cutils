name: Release 🚀

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GNUPGHOME: ${{ runner.temp }}/gnupg  # clean GPG home
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java & Maven
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          server-id: ossrh
          server-username: ${{ secrets.SONATYPE_USERNAME }}
          server-password: ${{ secrets.SONATYPE_PASSWORD }}
          cache: maven

      # Generate a temporary GPG key for this workflow run
      - name: Generate temporary GPG key
        run: |
          mkdir -p $GNUPGHOME
          chmod 700 $GNUPGHOME

          gpg --batch --gen-key <<EOF
          %echo Generating CI key
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: CI
          Name-Email: ci@example.com
          Expire-Date: 1d
          %no-protection
          %commit
          %echo Done
          EOF

      # Build & Deploy signed artifacts
      - name: Build & Deploy
        run: mvn -B clean deploy