name: Release 🚀

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java & Maven
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          ossrh-username: ${{ secrets.SONATYPE_USERNAME }}
          ossrh-password: ${{ secrets.SONATYPE_PASSWORD }}
          server-id: ossrh

      - name: Generate temporary GPG key
        id: generate_gpg
        run: |
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -p $GNUPGHOME
          chmod 700 $GNUPGHOME

          gpg --batch --gen-key <<EOF
          %echo Generating CI key
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: CI
          Name-Email: ci@example.com
          Expire-Date: 1d
          %no-protection
          %commit
          %echo Done
          EOF

          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "KEY_ID=$KEY_ID" >> $GITHUB_ENV

      - name: Build & Deploy
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        run: |
          mvn -B clean deploy -Dgpg.keyname=$KEY_ID

      # (Optional) Clean up GPG files
      - name: Cleanup GPG
        if: always()
        run: rm -rf $RUNNER_TEMP/gnupg