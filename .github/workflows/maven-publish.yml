name: Release 🚀

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java & Maven
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          server-id: ossrh
          server-username: ${{ secrets.SONATYPE_USERNAME }}
          server-password: ${{ secrets.SONATYPE_PASSWORD }}
          cache: maven

      # Import GPG key manually
      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo RELOADAGENT | gpg-connect-agent

      # Create settings-security.xml so Maven can read passphrase
      - name: Create settings-security.xml
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.m2
          echo "<settingsSecurity><master>${GPG_PASSPHRASE}</master></settingsSecurity>" > ~/.m2/settings-security.xml

      - name: Build & Deploy
        run: mvn -B clean deploy